<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Artigo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 20px;
    }

    img {
      width: 100%;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    .voltar {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: blue;
      font-weight: bold;
    }

    .conteudo p {
      line-height: 1.6;
      color: #333;
    }
  </style>
</head>

<body>

  <a href="index.html" class="voltar">← Voltar</a>

  <div class="container" id="artigo"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const url = `https://acbrasil.org.br/cms/wp-json/wp/v2/posts/${id}?_embed`;

    fetch(url)
      .then(res => res.json())
      .then(post => {

        const imagem = post._embedded?.["wp:featuredmedia"]?.[0]?.source_url || "";

        const titulo = post.title.rendered.replace(/<[^>]+>/g, "");

        document.getElementById("artigo").innerHTML = `
          <h1>${titulo}</h1>

          ${imagem ? `<img src="${imagem}" alt="">` : ""}

          <div class="conteudo">
            ${post.content.rendered}
          </div>
        `;
      })
      .catch(err => console.error("Erro:", err));
  </script>

</body>
</html>
