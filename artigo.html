<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Artigo</title>
 <style>
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
    font-size: 18px; /* 📱 mobile */
    line-height: 1.7;
  }

  .container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }

  .voltar {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    color: blue;
    font-weight: bold;
  }

  /* 📱 MOBILE (até 600px) */
  h1 { font-size: 28px; margin-bottom: 20px; }
  h2 { font-size: 24px; margin-top: 20px; }
  h3 { font-size: 20px; margin-top: 16px; }

  p {
    font-size: 18px;
    margin-bottom: 14px;
    color: #333;
  }

  li {
    font-size: 18px;
    margin-bottom: 8px;
  }

  ul {
    padding-left: 20px;
  }

  img {
    width: 100%;
    margin: 20px 0;
    border-radius: 8px;
  }

  /* 📲 PHABLET (601px – 768px) */
  @media (min-width: 601px) {
    body {
      font-size: 17px;
    }

    h1 { font-size: 26px; }
    h2 { font-size: 22px; }
    h3 { font-size: 18px; }

    p, li { font-size: 17px; }
  }

  /* 💻 TABLET+ (≥ 769px) */
  @media (min-width: 769px) {
    body {
      font-size: 16px;
    }

    h1 { font-size: 24px; }
    h2 { font-size: 20px; }
    h3 { font-size: 17px; }

    p, li { font-size: 16px; }
  }
</style>
  
</head>

<body>

  <a href="index.html" class="voltar">← Voltar</a>

  <div class="container" id="artigo"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const url = `https://acbrasil.org.br/cms/wp-json/wp/v2/posts/${id}?_embed`;

    fetch(url)
      .then(res => res.json())
      .then(post => {

        const imagem = post._embedded?.["wp:featuredmedia"]?.[0]?.source_url || "";

        const titulo = post.title.rendered.replace(/<[^>]+>/g, "");

        document.getElementById("artigo").innerHTML = `
          <h1>${titulo}</h1>

          ${imagem ? `<img src="${imagem}" alt="">` : ""}

          <div class="conteudo">
            ${post.content.rendered}
          </div>
        `;
      })
      .catch(err => console.error("Erro:", err));
  </script>

</body>
</html>
